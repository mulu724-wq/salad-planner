<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Salad Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --cream: #F3EADB;
    --paper: #FAF5EA;
    --sage: #A9B9A5;
    --chamomile: #E2B65A;
    --olive: #5E6B3A;
    --burgundy: #6A2A3B;
    --text: #2B2A24;
    --muted: #5A5848;
    --line: rgba(94, 107, 58, 0.22);
    --glass: rgba(250, 245, 234, 0.72);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--text);
    font-family: 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    font-size: 16px;
    line-height: 1.65;
    word-break: keep-all;
  }
  h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--burgundy); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* 배경: 팔레트 색의 흐린 빛 덩어리가 천천히 움직인다 */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
        background: linear-gradient(180deg, #F7EFE1 0%, #F3EADB 55%, #EADFCB 100%); }
  .bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; will-change: transform; }
  .bg i:nth-child(1) { width: 62vmax; height: 62vmax; left: -22vmax; top: -24vmax; background: var(--sage); animation: drift1 38s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { width: 46vmax; height: 46vmax; right: -18vmax; top: 18vmax; background: var(--chamomile); opacity: 0.42; animation: drift2 46s ease-in-out infinite alternate; }
  .bg i:nth-child(3) { width: 40vmax; height: 40vmax; left: 8vmax; bottom: -22vmax; background: var(--burgundy); opacity: 0.20; animation: drift3 52s ease-in-out infinite alternate; }
  .bg i:nth-child(4) { width: 34vmax; height: 34vmax; right: 6vmax; bottom: -14vmax; background: var(--olive); opacity: 0.22; animation: drift1 60s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from { transform: translate(0, 0) scale(1); }    to { transform: translate(6vmax, 5vmax) scale(1.08); } }
  @keyframes drift2 { from { transform: translate(0, 0) scale(1); }    to { transform: translate(-7vmax, -4vmax) scale(1.12); } }
  @keyframes drift3 { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(5vmax, -6vmax) scale(0.95); } }
  @media (prefers-reduced-motion: reduce) { .bg i { animation: none; } }

  .app { max-width: 600px; margin: 0 auto; padding: 56px 20px 88px; display: flex; flex-direction: column; gap: 40px; }

  /* 상단 제목: 크고 가운데 정렬 */
  .head { text-align: center; padding: 20px 0 0; }
  .head h1 {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Noto Sans KR', sans-serif;
    font-size: clamp(22px, 6vw, 36px); line-height: 1.2; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-wrap: balance;
    color: var(--burgundy);
  }

  .link-btn { background: none; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; color: var(--burgundy); font-size: 14px; font-weight: 500; }
  .link-btn:hover { text-decoration: underline; }

  .section-title { font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; color: var(--text); margin-bottom: 14px; }

  .glass { background: var(--glass); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px);
           border: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 8px 30px rgba(74, 62, 40, 0.08); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .glass { background: var(--paper); } }

  .panel { border-radius: var(--radius); padding: 24px 22px; display: flex; flex-direction: column; gap: 16px; }
  .panel p { font-size: 15px; color: var(--muted); }
  .panel code { font-size: 13px; background: rgba(94,107,58,0.12); padding: 1px 6px; border-radius: 6px; }

  .msg { font-size: 14px; color: var(--muted); text-align: center; overflow-wrap: anywhere; }
  .msg:empty { display: none; }
  .msg.error { color: var(--burgundy); font-weight: 500; }

  .summary { display: flex; flex-wrap: wrap; gap: 14px; }
  .stat { flex: 1 1 140px; border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 13px; color: var(--muted); }
  .stat .value { font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; color: var(--burgundy); }
  .stat .value small { font-size: 16px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .week { font-size: 14px; color: var(--muted); margin-top: 12px; text-align: center; }

  .cta {
    width: 100%; min-height: 58px; border: 0; cursor: pointer; border-radius: 999px;
    background: var(--burgundy); color: var(--paper);
    font-size: 18px; font-weight: 600; padding: 14px 24px;
    box-shadow: 0 10px 26px rgba(106, 42, 59, 0.28);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .cta:hover:not(:disabled) { background: #561f2e; transform: translateY(-1px); }
  .cta:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 4px 12px rgba(106, 42, 59, 0.25); }
  .cta:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  .cta.secondary { background: var(--olive); box-shadow: 0 10px 26px rgba(94, 107, 58, 0.28); }
  .cta.secondary:hover:not(:disabled) { background: #4c582f; }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .empty { border-radius: var(--radius); border: 1px dashed rgba(94,107,58,0.5); background: rgba(250,245,234,0.5); padding: 32px 22px; text-align: center; color: var(--muted); font-size: 15px; }
  .card { border-radius: var(--radius); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; transition: background .2s ease, border-color .2s ease; }
  .card.done { background: rgba(213, 226, 208, 0.82); border-color: rgba(94,107,58,0.4); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .day { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: var(--olive); }
  .card h3 { font-size: 20px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em; }
  .meta { font-size: 14px; color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 13px; padding: 3px 12px; background: rgba(169,185,165,0.7); color: var(--text); border-radius: 999px; }
  .src { font-size: 14px; }
  .src a { color: var(--burgundy); }

  .check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; font-size: 15px; user-select: none; }
  .check input { width: 22px; height: 22px; accent-color: var(--burgundy); cursor: pointer; margin: 0; }

  .shop-count { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .list { border-radius: var(--radius); overflow: hidden; }
  .list:empty { display: none; }
  .list li { border-bottom: 1px solid var(--line); }
  .list li:last-child { border-bottom: 0; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 20px; cursor: pointer; }
  .row input { width: 22px; height: 22px; accent-color: var(--burgundy); cursor: pointer; margin: 0; flex: 0 0 auto; }
  .row .name { flex: 1 1 auto; font-size: 16px; }
  .row .qty { flex: 0 0 auto; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.bought .name, .row.bought .qty { color: var(--muted); text-decoration: line-through; }

  /* 카드의 레시피 이름 버튼 */
  .card-link { background: none; border: 0; padding: 0; margin: 0; min-height: 44px; display: inline-flex; align-items: center; gap: 10px;
               font: inherit; font-weight: 700; letter-spacing: -0.01em; text-align: left; color: var(--text); cursor: pointer; }
  .card-link:hover { color: var(--burgundy); }
  .chev { flex: 0 0 auto; width: 8px; height: 8px; border-right: 2px solid var(--olive); border-top: 2px solid var(--olive); transform: rotate(45deg); }

  /* 상세 화면 */
  .stack { display: flex; flex-direction: column; gap: 32px; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; }
  .back::before { content: ''; width: 8px; height: 8px; border-left: 2px solid var(--burgundy); border-bottom: 2px solid var(--burgundy); transform: rotate(45deg); }
  .d-head { text-align: center; display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
  .d-head h2 { font-size: clamp(28px, 7.5vw, 40px); line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; color: var(--burgundy); }
  .d-ing li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 20px; }
  .d-ing .name { font-size: 16px; }
  .d-ing .qty { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .d-steps { font-size: 16px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  .d-steps.none { color: var(--muted); font-size: 15px; }
  .d-eaten { border-radius: 999px; padding: 4px 22px; justify-content: center; align-self: center; }

  .note { font-size: 13px; line-height: 1.7; color: var(--muted); text-align: center; padding-top: 8px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="app">

  <header class="head">
    <h1>Weekly Salad Planner</h1>
  </header>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>

  <!-- 설정 누락 안내 -->
  <section id="view-config" class="panel glass" hidden>
    <p>Supabase 연결 값이 비어 있습니다. 이 파일 아래쪽 스크립트의 <code>SUPABASE_URL</code>과 <code>SUPABASE_PUBLISHABLE_KEY</code>에 Project URL과 publishable 키를 붙여 넣은 뒤 다시 배포해 주세요.</p>
  </section>

  <!-- 연결 실패 -->
  <section id="view-conn" class="panel glass" hidden>
    <p id="conn-text">서버에 연결하지 못했습니다.</p>
    <button type="button" class="cta" id="btn-retry">다시 시도</button>
  </section>

  <!-- 앱 -->
  <div id="view-app" hidden style="display:flex;flex-direction:column;gap:36px;">

    <section aria-labelledby="t-summary">
      <h2 class="section-title" id="t-summary">이번 주 요약</h2>
      <div class="summary">
        <div class="stat glass"><span class="label">먹은 끼니</span><span class="value" id="stat-eaten">0<small> / 0</small></span></div>
        <div class="stat glass"><span class="label">산 재료</span><span class="value" id="stat-bought">0<small> / 0</small></span></div>
      </div>
      <p class="week" id="week-label"></p>
    </section>

    <section aria-label="추천">
      <button type="button" class="cta" id="btn-recommend">이번 주 추천받기</button>
    </section>

    <section aria-labelledby="t-cards">
      <h2 class="section-title" id="t-cards">요일별 샐러드</h2>
      <div id="cards" class="cards"></div>
    </section>

    <section aria-labelledby="t-shop">
      <h2 class="section-title" id="t-shop">장보기 체크리스트</h2>
      <p class="shop-count" id="shop-count"></p>
      <ul class="list glass" id="shop-list"></ul>
    </section>

    <p class="note" id="note"></p>
  </div>

  <!-- 레시피 상세 -->
  <div id="view-detail" class="stack" hidden>
    <button type="button" class="link-btn back" id="btn-back">목록으로</button>

    <header class="d-head">
      <span class="day" id="d-day"></span>
      <h2 id="d-name"></h2>
      <p class="meta" id="d-meta"></p>
    </header>

    <section aria-labelledby="t-ing">
      <h3 class="section-title" id="t-ing">재료</h3>
      <ul class="list glass d-ing" id="d-ing"></ul>
    </section>

    <section aria-labelledby="t-steps">
      <h3 class="section-title" id="t-steps">조리법 요약</h3>
      <div class="panel glass"><p class="d-steps" id="d-steps"></p></div>
    </section>

    <p class="src" id="d-src" style="text-align:center"></p>

    <label class="check glass d-eaten"><input type="checkbox" id="d-eaten">먹음으로 표시</label>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

   Supabase 연결 값 (아래 두 줄만 채우면 됩니다)
   - SUPABASE_URL: Project URL (https://xxxx.supabase.co)
   - SUPABASE_PUBLISHABLE_KEY: publishable 키 (secret / service_role 키는 넣지 않는다)
------------------------------------------------------------------- */

const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OthP3HTcr_-REP2MYVCbPw_rnIh7P-K';

/* 레시피 테이블이 비어 있을 때 한 번 넣을 수 있는 샘플 10개.
   직접 정리한 30개는 Supabase의 recipes 테이블에 넣거나, 아래 배열을 바꿔서 넣으면 된다. */
const SEED = [
  { name: '닭가슴살 퀴노아 샐러드', minutes: 15, ingredients: [

      { name: '방울토마토', qty: 6, unit: '개' }, { name: '오이', qty: 0.5, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '레몬즙', qty: 1, unit: '큰술' } ] },
  { name: '렌틸콩 참치 샐러드', minutes: 10, ingredients: [
      { name: '삶은 렌틸콩', qty: 100, unit: 'g' }, { name: '참치캔', qty: 0.5, unit: '개' },
      { name: '적양파', qty: 0.25, unit: '개' }, { name: '파프리카', qty: 0.5, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '식초', qty: 1, unit: '큰술' } ] },
  { name: '병아리콩 페타 샐러드', minutes: 10, ingredients: [
      { name: '삶은 병아리콩', qty: 100, unit: 'g' }, { name: '페타치즈', qty: 40, unit: 'g' },
      { name: '오이', qty: 0.5, unit: '개' }, { name: '방울토마토', qty: 6, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '레몬즙', qty: 1, unit: '큰술' } ] },
  { name: '훈제연어 아보카도 샐러드', minutes: 15, ingredients: [
      { name: '훈제연어', qty: 80, unit: 'g' }, { name: '아보카도', qty: 0.5, unit: '개' },
      { name: '어린잎채소', qty: 60, unit: 'g' }, { name: '오이', qty: 0.5, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '레몬즙', qty: 1, unit: '큰술' } ] },
  { name: '달걀 시저 샐러드', minutes: 15, ingredients: [
      { name: '달걀', qty: 2, unit: '개' }, { name: '로메인', qty: 80, unit: 'g' },
      { name: '파마산치즈', qty: 15, unit: 'g' }, { name: '시저 드레싱', qty: 2, unit: '큰술' } ] },
  { name: '두부 에다마메 샐러드', minutes: 15, ingredients: [
      { name: '두부', qty: 100, unit: 'g' }, { name: '냉동 에다마메', qty: 50, unit: 'g' },
      { name: '어린잎채소', qty: 60, unit: 'g' }, { name: '방울토마토', qty: 5, unit: '개' },
      { name: '간장', qty: 1, unit: '큰술' }, { name: '올리브유', qty: 1, unit: '큰술' }, { name: '식초', qty: 1, unit: '큰술' } ] },
  { name: '구운 새우 아보카도 샐러드', minutes: 20, ingredients: [
      { name: '냉동 새우', qty: 100, unit: 'g' }, { name: '어린잎채소', qty: 60, unit: 'g' },
      { name: '방울토마토', qty: 6, unit: '개' }, { name: '아보카도', qty: 0.5, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '레몬즙', qty: 1, unit: '큰술' } ] },
  { name: '렌틸콩 시금치 페타 샐러드', minutes: 15, ingredients: [
      { name: '삶은 렌틸콩', qty: 100, unit: 'g' }, { name: '시금치', qty: 60, unit: 'g' },
      { name: '페타치즈', qty: 40, unit: 'g' }, { name: '적양파', qty: 0.25, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '식초', qty: 1, unit: '큰술' } ] },
  { name: '닭가슴살 병아리콩 샐러드', minutes: 15, ingredients: [
      { name: '조리된 닭가슴살', qty: 100, unit: 'g' }, { name: '삶은 병아리콩', qty: 80, unit: 'g' },
      { name: '로메인', qty: 60, unit: 'g' }, { name: '방울토마토', qty: 6, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '식초', qty: 1, unit: '큰술' } ] },
  { name: '퀴노아 훈제연어 샐러드', minutes: 15, ingredients: [

      { name: '어린잎채소', qty: 60, unit: 'g' }, { name: '오이', qty: 0.5, unit: '개' },
      { name: '올리브유', qty: 1, unit: '큰술' }, { name: '레몬즙', qty: 1, unit: '큰술' } ] }
];

const DAYS = ['월', '화', '수', '목', '금'];
const MEALS_PER_WEEK = 5;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtQty = (n) => String(Math.round(Number(n) * 100) / 100);
const pad = (n) => String(n).padStart(2, '0');

/* 주 시작일(월요일): 일요일에 열면 곧 시작되는 월요일, 그 외에는 이번 주 월요일 */
function weekStart(today) {
  const d = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const dow = d.getDay();
  d.setDate(d.getDate() + (dow === 0 ? 1 : -(dow - 1)));
  return d;
}
const WEEK = weekStart(new Date());
const WEEK_KEY = WEEK.getFullYear() + '-' + pad(WEEK.getMonth() + 1) + '-' + pad(WEEK.getDate());

/* 화면 상태 */
const state = { user: null, recipes: [], plan: [], items: [], busy: false, loaded: false, detailId: null };

const configured = SUPABASE_URL.indexOf('https://') === 0 && SUPABASE_PUBLISHABLE_KEY.indexOf('여기에') === -1 && SUPABASE_PUBLISHABLE_KEY.length > 20;
let sb = null;

function say(text, isError) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = 'msg' + (isError ? ' error' : '');
}

function showView(name) {
  $('view-config').hidden = name !== 'config';
  $('view-conn').hidden = name !== 'conn';
  $('view-app').hidden = name !== 'app';
  $('view-detail').hidden = name !== 'detail';
}

/* 로그인 상태에서는 목록 또는 상세 중 하나를 보여준다 */
function applyView() {
  if (!state.user) return;
  showView(state.detailId ? 'detail' : 'app');
}

/* ---------------- 데이터 처리 ---------------- */

/* 카드에 보여줄 주요 재료: 양념(큰술 단위)을 뺀 앞의 3개 */
function mainIngredients(recipe) {
  const list = Array.isArray(recipe.ingredients) ? recipe.ingredients : [];
  return list.filter((i) => i.unit !== '큰술').slice(0, 3).map((i) => i.name);
}

function pickRecipes(pool, count) {
  const a = pool.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, count);
}

/* 선택한 레시피의 재료를 이름+단위 기준으로 합산 */
function buildShopping(recipes) {
  const map = new Map();
  recipes.forEach((r) => (Array.isArray(r.ingredients) ? r.ingredients : []).forEach((ing) => {
    const key = ing.name + '|' + ing.unit;
    if (map.has(key)) map.get(key).qty += Number(ing.qty);
    else map.set(key, { name: ing.name, unit: ing.unit, qty: Number(ing.qty) });
  }));
  return Array.from(map.values());
}

async function loadAll() {
  const [r, p, s] = await Promise.all([
    sb.from('recipes').select('*').order('created_at', { ascending: true }),
    sb.from('weekly_plans').select('id, weekday, recipe_id, eaten').eq('week_start', WEEK_KEY).order('weekday', { ascending: true }),
    sb.from('shopping_items').select('id, name, qty, unit, purchased').eq('week_start', WEEK_KEY).order('name', { ascending: true })
  ]);
  const err = r.error || p.error || s.error;
  if (err) throw err;
  state.recipes = r.data || [];
  state.plan = (p.data || [])
    .map((row) => ({ id: row.id, weekday: row.weekday, eaten: row.eaten, recipe: state.recipes.find((x) => x.id === row.recipe_id) }))
    .filter((x) => x.recipe);
  state.items = (s.data || []).map((row) => ({ id: row.id, name: row.name, qty: Number(row.qty), unit: row.unit, purchased: row.purchased }));
  state.loaded = true;
}

/* 기능 1: 추천받기 -> 5끼 계획과 합산 장보기 목록을 저장 */
async function recommend() {
  if (state.busy) return;
  if (state.recipes.length < MEALS_PER_WEEK) {
    say('레시피가 ' + MEALS_PER_WEEK + '개 이상 있어야 추천할 수 있습니다.', true);
    return;
  }
  state.busy = true; render(); say('추천을 만들고 저장하는 중입니다.');
  try {
    const picked = pickRecipes(state.recipes, MEALS_PER_WEEK);
    const items = buildShopping(picked);

    let res = await sb.from('weekly_plans').delete().eq('week_start', WEEK_KEY);
    if (res.error) throw res.error;
    res = await sb.from('shopping_items').delete().eq('week_start', WEEK_KEY);
    if (res.error) throw res.error;

    res = await sb.from('weekly_plans').insert(
      picked.map((r, i) => ({ week_start: WEEK_KEY, weekday: i + 1, recipe_id: r.id, eaten: false }))
    );
    if (res.error) throw res.error;
    res = await sb.from('shopping_items').insert(
      items.map((it) => ({ week_start: WEEK_KEY, name: it.name, qty: it.qty, unit: it.unit, purchased: false }))
    );
    if (res.error) throw res.error;

    await loadAll();
    say('이번 주 5끼를 저장했습니다.');
  } catch (e) {
    say('저장하지 못했습니다: ' + (e.message || e), true);
    try { await loadAll(); } catch (_) { /* 무시 */ }
  } finally {
    state.busy = false; render();
  }
}

/* 기능 2: 먹음 체크 저장 */
async function setEaten(planId, value) {
  const entry = state.plan.find((x) => x.id === planId);
  if (!entry) return;
  const before = entry.eaten;
  entry.eaten = value; render(planId);
  const { error } = await sb.from('weekly_plans').update({ eaten: value }).eq('id', planId);
  if (error) { entry.eaten = before; render(planId); say('먹음 체크를 저장하지 못했습니다: ' + error.message, true); }
  else say('');
}

/* 기능 3: 구매 체크 저장 */
async function setPurchased(itemId, value) {
  const item = state.items.find((x) => x.id === itemId);
  if (!item) return;
  const before = item.purchased;
  item.purchased = value; render(itemId);
  const { error } = await sb.from('shopping_items').update({ purchased: value }).eq('id', itemId);
  if (error) { item.purchased = before; render(itemId); say('구매 체크를 저장하지 못했습니다: ' + error.message, true); }
  else say('');
}

async function insertSamples() {
  if (state.busy) return;
  state.busy = true; render(); say('샘플 레시피를 넣는 중입니다.');
  try {
    const { error } = await sb.from('recipes').insert(SEED.map((r) => ({
      name: r.name, minutes: r.minutes, ingredients: r.ingredients
    })));
    if (error) throw error;
    await loadAll();
    say('샘플 레시피 ' + SEED.length + '개를 넣었습니다.');
  } catch (e) {
    say('넣지 못했습니다: ' + (e.message || e), true);
  } finally {
    state.busy = false; render();
  }
}

/* ---------------- 화면 그리기 ---------------- */

function render(focusId) {
  /* 상세로 보던 계획이 사라졌으면 목록으로 돌아간다 */
  if (state.detailId && state.loaded && !state.plan.some((x) => x.id === state.detailId)) {
    state.detailId = null;
    applyView();
  }
  $('week-label').textContent = (WEEK.getMonth() + 1) + '월 ' + WEEK.getDate() + '일 월요일 시작 주';

  const hasPlan = state.plan.length > 0;
  const noRecipes = state.loaded && state.recipes.length === 0;

  const btn = $('btn-recommend');
  btn.disabled = state.busy || !state.loaded;
  if (noRecipes) {
    btn.textContent = '샘플 레시피 ' + SEED.length + '개 넣기';
    btn.classList.add('secondary');
  } else {
    btn.textContent = hasPlan ? '다시 추천받기' : '이번 주 추천받기';
    btn.classList.remove('secondary');
  }

  const cards = $('cards');
  if (!state.loaded) {
    cards.innerHTML = '<div class="empty">불러오는 중입니다.</div>';
  } else if (noRecipes) {
    cards.innerHTML = '<div class="empty">저장된 레시피가 없습니다. 위 버튼으로 샘플을 넣거나, Supabase의 recipes 테이블에 직접 입력해 주세요.</div>';
  } else if (!hasPlan) {
    cards.innerHTML = '<div class="empty">"이번 주 추천받기"를 누르면 5끼가 여기에 나옵니다.</div>';
  } else {
    cards.innerHTML = state.plan.map((e) => {
      const r = e.recipe;
      const url = r.source_url && /^https?:\/\//.test(r.source_url) ? r.source_url : '';
      const src = url
        ? '<p class="src">영감 출처: <a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(r.source_name || '원문 보기') + '</a></p>'
        : '';
      return '<article class="card glass' + (e.eaten ? ' done' : '') + '">' +
        '<div class="card-top"><span class="day">' + (DAYS[e.weekday - 1] || '') + '요일</span>' +
        '<label class="check"><input type="checkbox" data-eaten="' + esc(e.id) + '"' + (e.eaten ? ' checked' : '') + '>먹음</label></div>' +
        '<h3><button type="button" class="card-link" data-open="' + esc(e.id) + '">' + esc(r.name) + '<span class="chev" aria-hidden="true"></span></button></h3>' +
        '<p class="meta">조리 ' + esc(r.minutes) + '분</p>' +
        '<div class="tags">' + mainIngredients(r).map((m) => '<span class="tag">' + esc(m) + '</span>').join('') + '</div>' +
        src + '</article>';
    }).join('');
  }

  const eatenCount = state.plan.filter((e) => e.eaten).length;
  const boughtCount = state.items.filter((it) => it.purchased).length;
  $('stat-eaten').innerHTML = eatenCount + '<small> / ' + state.plan.length + '</small>';
  $('stat-bought').innerHTML = boughtCount + '<small> / ' + state.items.length + '</small>';

  $('shop-count').textContent = state.items.length
    ? '5끼 재료를 합산한 목록입니다.'
    : '추천을 받으면 5끼 재료가 합산되어 여기에 나옵니다.';
  $('shop-list').innerHTML = state.items.map((it) =>
    '<li><label class="row' + (it.purchased ? ' bought' : '') + '">' +
    '<input type="checkbox" data-bought="' + esc(it.id) + '"' + (it.purchased ? ' checked' : '') + '>' +
    '<span class="name">' + esc(it.name) + '</span>' +
    '<span class="qty">' + fmtQty(it.qty) + esc(it.unit) + '</span></label></li>'
  ).join('');

  $('note').textContent = '체크와 추천 결과는 이 브라우저에 연결되어 저장됩니다. 다시 열어도 이번 주 목록이 그대로 보이지만, 브라우저 데이터를 지우거나 다른 기기에서 열면 새로 시작됩니다.';

  if (state.detailId) renderDetail();

  /* 다시 그린 뒤에도 키보드 포커스 유지 */
  if (focusId && !state.detailId) {
    const el = document.querySelector('input[data-eaten="' + focusId + '"], input[data-bought="' + focusId + '"]');
    if (el) el.focus();
  }
}

/* ---------------- 레시피 상세 ---------------- */

function renderDetail() {
  const e = state.plan.find((x) => x.id === state.detailId);
  if (!e) return;
  const r = e.recipe;
  $('d-day').textContent = (DAYS[e.weekday - 1] || '') + '요일';
  $('d-name').textContent = r.name;
  $('d-meta').textContent = '조리 ' + r.minutes + '분';

  const ings = Array.isArray(r.ingredients) ? r.ingredients : [];
  $('d-ing').innerHTML = ings.map((i) =>
    '<li><span class="name">' + esc(i.name) + '</span><span class="qty">' + fmtQty(i.qty) + esc(i.unit) + '</span></li>'
  ).join('');

  const steps = (r.steps_summary || '').trim();
  const st = $('d-steps');
  st.textContent = steps || '조리법 요약이 아직 입력되지 않았습니다.';
  st.className = 'd-steps' + (steps ? '' : ' none');

  const url = r.source_url && /^https?:\/\//.test(r.source_url) ? r.source_url : '';
  $('d-src').innerHTML = url
    ? '영감 출처: <a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer" style="color:var(--burgundy)">' + esc(r.source_name || '원문 보기') + '</a>'
    : '';

  $('d-eaten').checked = !!e.eaten;
}

function openDetail(planId) {
  state.detailId = planId;
  history.pushState({ d: planId }, '');
  applyView(); render();
  window.scrollTo(0, 0);
  $('btn-back').focus();
}

function closeDetail() {
  if (history.state && history.state.d) history.back();   /* popstate에서 정리 */
  else { state.detailId = null; applyView(); render(); window.scrollTo(0, 0); }
}

/* ---------------- 로그인 ---------------- */

/* 로그인 화면 없이, 방문한 브라우저마다 익명 계정을 자동으로 만들어 쓴다 */
let signingIn = false;
async function ensureSession() {
  if (signingIn) return;
  signingIn = true;
  showView('app'); render(); say('연결하는 중입니다.');
  const { error } = await sb.auth.signInAnonymously();
  signingIn = false;
  if (error) {
    say('');
    $('conn-text').textContent = '서버에 연결하지 못했습니다: ' + error.message +
      ' (Supabase의 Authentication > Sign In / Providers에서 Anonymous Sign-Ins가 켜져 있는지 확인해 주세요.)';
    showView('conn');
  }
  /* 성공하면 onAuthStateChange의 SIGNED_IN에서 이어진다 */
}

async function handleSession(session) {
  const user = session && session.user ? session.user : null;
  if (!user) { state.user = null; state.started = false; ensureSession(); return; }
  if (state.started && state.user && state.user.id === user.id) return;
  state.started = true;
  state.user = user;
  state.recipes = []; state.plan = []; state.items = []; state.loaded = false; state.detailId = null;

  applyView(); render(); say('');
  try {
    await loadAll();
  } catch (e) {
    say('목록을 불러오지 못했습니다: ' + (e.message || e), true);
  }
  render();
}

/* ---------------- 시작 ---------------- */

document.addEventListener('change', (e) => {
  const t = e.target;
  if (!t.dataset) return;
  if (t.id === 'd-eaten') { if (state.detailId) setEaten(state.detailId, t.checked); }
  else if (t.dataset.eaten) setEaten(t.dataset.eaten, t.checked);
  else if (t.dataset.bought) setPurchased(t.dataset.bought, t.checked);
});

document.addEventListener('click', (ev) => {
  const o = ev.target.closest && ev.target.closest('[data-open]');
  if (o) openDetail(o.dataset.open);
});
$('btn-back').addEventListener('click', closeDetail);
window.addEventListener('popstate', (ev) => {
  const prev = state.detailId;
  state.detailId = (ev.state && ev.state.d) || null;
  if (!state.user) return;
  applyView(); render();
  window.scrollTo(0, 0);
  if (!state.detailId && prev) {
    const back = document.querySelector('[data-open="' + prev + '"]');
    if (back) back.focus();
  } else if (state.detailId) {
    $('btn-back').focus();
  }
});

if (!configured || !window.supabase) {
  showView('config');
  if (configured && !window.supabase) say('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.', true);
} else {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  $('btn-retry').addEventListener('click', () => { signingIn = false; ensureSession(); });
  $('btn-recommend').addEventListener('click', () => {
    if (state.loaded && state.recipes.length === 0) insertSamples();
    else recommend();
  });
  /* 콜백 안에서 바로 Supabase를 호출하면 교착이 생길 수 있어 다음 틱으로 넘긴다 */
  sb.auth.onAuthStateChange((_event, session) => { setTimeout(() => handleSession(session), 0); });
}
</script>
